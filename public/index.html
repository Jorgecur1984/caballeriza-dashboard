<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Kiosco de Salas – Caballeriza</title>

<style>
:root{
  --ok:#22c55e;
  --busy:#ef4444;
  --warn:#f59e0b;
  --bg:#0b1020;
  --card:#11162a;
  --card2:#0e1428;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --accent:#60a5fa;
  --gold:#fbbf24;
  --card-h: clamp(180px, 26vh, 230px);
  --radius-lg: 16px;
}

html,body{height:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Ubuntu,Inter,Arial,sans-serif;
  overflow:hidden;
}

/* ===== CARD ===== */
.card{
  position:relative;
  display:flex;
  flex-direction:column;
  gap:8px;
  background:linear-gradient(180deg,var(--card), var(--card2) 60%);
  border:1px solid #1c2442;
  border-radius:var(--radius-lg);
  padding:14px;
  padding-top:52px;
  height:var(--card-h);
  box-shadow:0 6px 18px rgba(0,0,0,.20);
  transition:.2s ease;
  overflow:hidden;
}

.card:hover{
  transform:translateY(-2px);
  box-shadow:0 12px 28px rgba(0,0,0,.28);
  border-color:#2a3a6b;
}

/* ===== SALAS RESTRINGIDAS ===== */
.card.restricted{
  border:1px solid var(--gold);
  box-shadow:0 0 0 1px var(--gold) inset;
}

.restricted-badge{
  position:absolute;
  top:10px;
  left:10px;
  padding:6px 10px;
  border-radius:999px;
  background:#1e293b;
  border:1px solid var(--gold);
  font-size:12px;
  color:var(--gold);
  z-index:2;
  white-space:nowrap;
}

/* ===== BADGE NORMAL ===== */
.busy-badge{
  position:absolute;
  top:10px;
  right:10px;
  padding:6px 10px;
  border-radius:999px;
  background:#172033;
  font-size:12px;
  border:1px solid #233054;
  z-index:2;
  white-space:nowrap;
  color:#cdd6e5;
}

/* ===== RESTO DEL ESTILO ORIGINAL ===== */

.grid{
  display:grid;
  grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
  gap:14px;
  padding:16px;
}

.statusBar{position:absolute;inset:auto 0 0 0;height:6px}
.status-ok{background:var(--ok)}
.status-busy{background:var(--busy)}
.status-warn{background:var(--warn)}
.status-info{background:var(--accent)}

.room-name{font-size:18px;font-weight:800;padding-right:120px}
.location{font-size:12px;color:var(--muted)}
.meta{margin-top:auto;font-size:12px;color:var(--muted)}

</style>
</head>

<body>

<section class="grid" id="grid"></section>

<script>

/* ===== SALAS RESTRINGIDAS ===== */
const RESTRICTED_ROOMS = [
  "Sala 3 Piso 1",
  "Sala 4 Piso 1",
  "Sala 6 Piso 2",
  "Sala 7 Piso 2",
  "Sala 8 Piso 2"
];

/* ===== EJEMPLO DE DATOS ===== */
/* (Esto no afecta tu API real) */
const ROOMS = [
  { room_name:"Sala 1 Piso 1", location:"Piso 1", capacity:8 },
  { room_name:"Sala 3 Piso 1", location:"Piso 1", capacity:10 },
  { room_name:"Sala 6 Piso 2", location:"Piso 2", capacity:12 },
  { room_name:"Sala 9 Piso 2", location:"Piso 2", capacity:6 }
];

function render(){
  const grid = document.getElementById("grid");
  grid.innerHTML = "";

  ROOMS.forEach(r=>{
    const card = document.createElement("article");
    card.className = "card";

    /* Si es sala restringida */
    if (RESTRICTED_ROOMS.includes(r.room_name)) {
      card.classList.add("restricted");

      const restricted = document.createElement("div");
      restricted.className = "restricted-badge";
      restricted.textContent = "🔒 Solo Gerentes y Directores";
      card.appendChild(restricted);
    }

    const badge = document.createElement("div");
    badge.className = "busy-badge";
    badge.textContent = "Libre";
    card.appendChild(badge);

    const bar = document.createElement("div");
    bar.className = "statusBar status-ok";
    card.appendChild(bar);

    const name = document.createElement("div");
    name.className = "room-name";
    name.textContent = r.room_name;

    const location = document.createElement("div");
    location.className = "location";
    location.textContent = r.location;

    const meta = document.createElement("div");
    meta.className = "meta";
    meta.innerHTML = `Capacidad: <b>${r.capacity}</b>`;

    card.append(name, location, meta);
    grid.appendChild(card);
  });
}

render();

</script>

</body>
</html>
